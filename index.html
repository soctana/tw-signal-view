  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>台股訊號查詢</span></div>
      <div class="asof" id="headerAsOf"></div>
    </header>
    <main class="workspace">
      <div class="mode-tabs" role="tablist" aria-label="操作週期">
        <button class="mode-tab" type="button" role="tab" aria-selected="true" data-mode="short">短線機會</button>
        <button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="long">中長期持有</button>
      </div>
      <section class="intro">
        <div class="intro-copy">
          <div class="eyebrow" id="modeEyebrow">近期清單</div>
          <h1 id="modeTitle">短線關注</h1>
          <p class="lead" id="modeLead">近期符合短線條件的股票。</p>
        </div>
        <div class="mode-tools">
          <div class="search-wrap" id="searchWrap">
            <form class="search-bar" id="searchForm" role="search">
              <input id="searchInput" autocomplete="off" inputmode="search" aria-label="股票代號或名稱" placeholder="查詢其他股票，例如 2330">
              <button class="search-btn" type="submit">查詢</button>
            </form>
            <div class="suggestions" id="suggestions" role="listbox"></div>
          </div>
          <div class="summary" id="summary"></div>
        </div>
      </section>
      <section class="shortlist-panel" id="shortPanel" aria-labelledby="shortlistTitle">
        <div class="section-head">
          <div><div class="eyebrow">近期符合</div><h2 id="shortlistTitle">短線關注清單</h2></div>
          <p>收盤價與底價均為最新資料日數值。</p>
        </div>
        <div class="shortlist" id="shortlist"></div>
      </section>
      <section class="shortlist-panel" id="longPanel" aria-labelledby="longlistTitle" hidden>
        <div class="section-head">
          <div><h2 id="longlistTitle">中長期正向清單</h2></div>
          <p>多頭走勢並且籌碼正向。</p>
        </div>
        <div class="shortlist" id="longlist"></div>
      </section>
      <section id="result" aria-live="polite"></section>
    </main>
    <footer><span>策略分類不是個人化投資建議。</span></footer>
  </div>
  <script src="./data.js"></script>
  <script>
    (() => {
      const dataset = window.SIGNAL_DATA || { meta: {}, stocks: [] };
      const stocks = dataset.stocks || [];
      const byCode = new Map(stocks.map(stock => [stock.code.toUpperCase(), stock]));
      const input = document.querySelector('#searchInput');
      const form = document.querySelector('#searchForm');
      const result = document.querySelector('#result');
      const suggestions = document.querySelector('#suggestions');
      const shortlist = document.querySelector('#shortlist');
      const longlist = document.querySelector('#longlist');
      const shortPanel = document.querySelector('#shortPanel');
      const longPanel = document.querySelector('#longPanel');
      const searchWrap = document.querySelector('#searchWrap');
      const meta = dataset.meta || {};
      let activeMode = 'short';
      let activeStock = null;

      document.querySelector('#headerAsOf').textContent = `更新至 ${meta.technicalAsOf || '—'}`;

      const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const normalize = value => value.trim().toUpperCase().replace(/^TWSE:|^TPEX:/, '').replace(/\s+/g, '');

      function findMatches(query) {
        const q = normalize(query);
        if (!q) return [];
        return stocks.filter(stock => stock.code.toUpperCase().includes(q) || stock.name.includes(query.trim())).slice(0, 6);
      }

      function renderEmpty(title, body) {
        result.innerHTML = `<div class="empty"><div><strong>${esc(title)}</strong>${esc(body)}</div></div>`;
      }

      function renderShortlist() {
        const selected = (dataset.shortlist || []).map(code => byCode.get(code)).filter(Boolean);
        shortlist.innerHTML = selected.length ? `<table class="stock-table short-table">
          <colgroup><col><col><col><col></colgroup>
          <thead><tr><th scope="col">代號</th><th scope="col">名稱</th><th scope="col" class="numeric">收盤價</th><th scope="col" class="numeric">底價</th></tr></thead>
          <tbody>${selected.map(stock => `<tr>
            <td class="stock-code" data-label="代號">${esc(stock.code)}</td><td class="stock-name" data-label="名稱">${esc(stock.name || '名稱未載')}</td><td class="numeric" data-label="收盤價">${esc(stock.close)}</td><td class="numeric" data-label="底價">${esc(stock.shortFloor || '—')}</td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="meta-line">本期沒有符合條件的股票。</div>';
      }

      function renderLonglist() {
        const selected = (dataset.longlist || []).map(code => byCode.get(code)).filter(Boolean);
        longlist.innerHTML = selected.length ? `<table class="stock-table long-table">
          <colgroup><col><col><col><col><col></colgroup>
          <thead><tr><th scope="col">代號</th><th scope="col">名稱</th><th scope="col" class="numeric">收盤價</th><th scope="col" class="numeric">起漲點</th><th scope="col" class="numeric">距起漲點</th></tr></thead>
          <tbody>${selected.map(stock => `<tr>
            <td data-label="代號"><button class="row-link" type="button" data-longlist-code="${esc(stock.code)}" aria-label="查看 ${esc(stock.code)} ${esc(stock.name || '')} 的中長期狀態">${esc(stock.code)}</button></td><td class="stock-name" data-label="名稱">${esc(stock.name || '名稱未載')}</td><td class="numeric" data-label="收盤價">${esc(stock.close)}</td><td class="numeric" data-label="起漲點">${esc(stock.longPriceAnchor.entry)}</td><td class="numeric distance" data-label="距起漲點">+${esc((stock.longPriceAnchor.premium * 100).toFixed(1))}%</td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="meta-line">本期沒有符合條件的股票。</div>';
      }

      function evidence(stock) {
        return stock.evidence || { trend: '資料待更新', chip: '資料待更新' };
      }

      function renderStock(stock) {
        activeStock = stock;
        const ev = evidence(stock);
        const state = stock.holding;
        const displayLabel = ({ entry: '正向', hold: '繼續持有', exit: '出清', pending: '資料待更新' }[state.key] || state.label || '狀態待確認');
        const copy = ({ entry: '目前訊號為正向。', hold: '技術尚未明顯轉弱，目前分類為繼續持有。', exit: '中長線技術條件處於弱勢，目前分類為出清；此判定不參考籌碼。', pending: '目前缺少同一資料日的完整判定。' }[state.key] || '目前沒有可顯示的分類說明。');
        result.innerHTML = `<div class="result-shell status-${esc(state.key)}">
          <div class="result-head">
            <div class="identity"><div><div class="code">${esc(stock.code)}</div><h2>${esc(stock.name || '名稱未載')}</h2></div><span class="market-tag">${esc(stock.kind)}</span></div>
            <div class="quote"><strong>${esc(stock.close)}</strong><small>收盤價</small></div>
          </div>
          <div class="result-status">
            <div><div class="status-kicker">中長期狀態</div><h3 class="status-label">${esc(displayLabel)}</h3><p class="status-copy">${esc(copy)}</p></div>
            <div><div class="evidence"><div class="evidence-row"><span>趨勢狀態</span><strong>${esc(ev.trend)}</strong></div><div class="evidence-row"><span>籌碼狀態</span><strong>${esc(ev.chip)}</strong></div></div><div class="date-note">趨勢 ${esc(stock.asOf)} · 籌碼 ${esc(stock.chipAsOf || '無資料')}</div></div>
          </div>
        </div>`;
        input.value = stock.code;
        suggestions.classList.remove('open');
        history.replaceState(null, '', `#${encodeURIComponent(stock.code)}`);
      }

      function setMode(mode) {
        activeMode = mode;
        document.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-selected', String(button.dataset.mode === mode)));
        shortPanel.hidden = mode !== 'short';
        longPanel.hidden = mode !== 'long';
        searchWrap.hidden = mode !== 'long';
        result.hidden = mode !== 'long';
        document.querySelector('#modeEyebrow').textContent = mode === 'short' ? '近期清單' : '持股查詢';
        document.querySelector('#modeTitle').textContent = mode === 'short' ? '短線關注' : '中長期狀態';
        document.querySelector('#modeLead').textContent = mode === 'short' ? '近期符合短線條件的股票。' : '先看符合中長線條件的觀察清單，也可查詢其他持股目前屬於正向、繼續持有或出清。';
        document.querySelector('#summary').innerHTML = mode === 'short'
          ? `<span>${meta.shortlistCount || 0} 檔近期符合</span><span>更新至 ${esc(meta.technicalAsOf || '—')}</span>`
          : `<span>${meta.longlistCount || 0} 檔列入觀察</span><span>${meta.coverage || 0} 檔可查詢</span><span>更新至 ${esc(meta.technicalAsOf || '—')}</span>`;
        input.placeholder = '輸入持有股票，例如 2330';
        if (mode === 'long' && activeStock) renderStock(activeStock);
        else if (mode === 'long') renderEmpty('查詢持有狀態', '輸入股票代號或名稱。');
        else suggestions.classList.remove('open');
      }

      function submitQuery() {
        const query = input.value;
        const exact = byCode.get(normalize(query));
        if (exact) return renderStock(exact);
        const matches = findMatches(query);
        if (matches.length === 1) return renderStock(matches[0]);
        renderEmpty('沒有唯一結果', matches.length ? '請從搜尋建議選擇股票。' : '此代號或名稱目前不在技術 universe。');
      }

      input.addEventListener('input', () => {
        const matches = findMatches(input.value);
        suggestions.innerHTML = matches.map(stock => `<button type="button" class="suggestion" data-code="${esc(stock.code)}" role="option"><span><b>${esc(stock.code)}</b> ${esc(stock.name)}</span></button>`).join('');
        suggestions.classList.toggle('open', matches.length > 0);
      });
      suggestions.addEventListener('click', event => {
        const button = event.target.closest('[data-code]');
        if (button) renderStock(byCode.get(button.dataset.code));
      });
      longlist.addEventListener('click', event => {
        const button = event.target.closest('[data-longlist-code]');
        if (button) renderStock(byCode.get(button.dataset.longlistCode));
      });
      document.querySelector('.mode-tabs').addEventListener('click', event => {
        const button = event.target.closest('[data-mode]');
        if (button) setMode(button.dataset.mode);
      });
      form.addEventListener('submit', event => { event.preventDefault(); submitQuery(); });
      document.addEventListener('click', event => { if (!event.target.closest('.search-wrap')) suggestions.classList.remove('open'); });

      renderShortlist();
      renderLonglist();
      const initial = decodeURIComponent(location.hash.slice(1));
      if (initial && byCode.has(normalize(initial))) {
        activeStock = byCode.get(normalize(initial));
        input.value = activeStock.code;
      }
      setMode('short');
    })();
  </script>
</body>
</html>
